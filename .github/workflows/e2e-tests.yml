name: E2E Tests

on: 
  workflow_dispatch: 

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          start: npm start
          browser: chrome

      - name : Upload Screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-screenshots-chrome
          path: cypress/screenshots
      
      - name : Upload Videos
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-screenshots-chrome
          path: cypress/screenshots
