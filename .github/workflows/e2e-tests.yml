name: E2E Tests

on: 
  workflow_dispatch: 
    inputs:
      base-url:
        description: 'Escolha o ambiente de sua preferência (local, homolog ou production)'
        required: true
        default: 'http://localhost:3000'
      browser:
        description: 'Escolha o navegador de sua preferência (electron, chrome, firefox ou edge)'
        required: true
        default: 'chrome'

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7


      - name: Cypress run
        uses: cypress-io/github-action@v7
        env:
          BASE_URL: ${{ github.event.inputs.base-url }}
        with:
          start: npm start
          browser: ${{ github.event.inputs.browser }}

      - name : Upload Screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-screenshots-chrome
          path: cypress/screenshots

      - name : Upload Videos
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cypress-videos-chrome
          path: cypress/videos
